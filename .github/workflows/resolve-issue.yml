name: resolve-issue

concurrency:
  group: maintain
  cancel-in-progress: true

on:
  issues:
    types: [edited, reopened, labeled]

permissions:
  contents: write

jobs:
  resolve-issue:
    if:
      contains(github.event.issue.labels.*.name, 'data-patch') || contains(github.event.issue.labels.*.name,
      'post-proposal')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_ACTION_CONTEXT: ${{ toJson(github) }}
      GITHUB_BOT_EMAIL: '${{ secrets.BOT_EMAIL }}'
      GITHUB_BOT_NAME: '${{ secrets.BOT_NAME }}'
      YANDEX_DISK_STORE_PATH: '${{ secrets.YANDEX_DISK_STORE_PATH }}'
      YANDEX_DISK_ACCESS_TOKEN: '${{ secrets.YANDEX_DISK_ACCESS_TOKEN }}'
      S3_BUCKET: '${{ secrets.S3_BUCKET }}'
      S3_REGION: '${{ secrets.S3_REGION }}'
      S3_ENDPOINT: '${{ secrets.S3_ENDPOINT }}'
      S3_ACCESS_KEY_ID: '${{ secrets.S3_ACCESS_KEY_ID }}'
      S3_SECRET_ACCESS_KEY: '${{ secrets.S3_SECRET_ACCESS_KEY }}'
      S3_PUBLIC_URL: '${{ secrets.S3_PUBLIC_URL }}'
      S3_STORE_PATH: '${{ secrets.S3_STORE_PATH }}'
      S3_STORE_SECRET_KEY: '${{ secrets.S3_STORE_SECRET_KEY }}'
      S3_UPLOADS_PATH: '${{ secrets.S3_UPLOADS_PATH }}'
      S3_UPLOADS_ACCESS_KEY_ID: '${{ secrets.S3_UPLOADS_ACCESS_KEY_ID }}'
      S3_UPLOADS_SECRET_ACCESS_KEY: '${{ secrets.S3_UPLOADS_SECRET_ACCESS_KEY }}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Resolve issue and commit changes
        shell: bash
        run: |
          npm run resolve-github-issue
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A

          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(resolve-issue): resolve #${{ github.event.issue.number }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
