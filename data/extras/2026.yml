2026-09-02-1-russian-version-of-the-site:
  title: Russian Version of the Site
  titleRu: Русская версия сайта
  description: >-
    Dear followers! The Morrowind Screenshots website is now available in Russian at
    [mwscr.dehero.ru](https://mwscr.dehero.ru/). You can switch between the Russian and English versions using the
    language button in the site header. The Russian version includes translated interface texts, topics and project
    materials. Welcome!
  descriptionRu: >-
    Дорогие подписчики! У сайта Morrowind Screenshots появилась русская версия по адресу
    [mwscr.dehero.ru](https://mwscr.dehero.ru/). Переключаться между русской и английской версиями можно с помощью
    кнопки выбора языка в шапке сайта. В русской версии переведены элементы интерфейса, справочные материалы и материалы
    проекта. Добро пожаловать!
