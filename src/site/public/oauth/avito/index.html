<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Avito Integration — Morrowind Screenshots</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #000;
        color: #dfc89e;
        font-family: Georgia, serif;
        line-height: 1.6;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
      }
      a {
        color: #dfc89e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Morrowind Screenshots</h1>
      <p>
        This is the OAuth redirect endpoint for the official Avito integration of the Morrowind Screenshots project.
      </p>
      <p>
        The integration is used by the project author to receive reviews of the project's own merch listings through
        the Avito Ratings API.
      </p>
      <p>
        <a href="https://mwscr.dehero.site/">Official website</a> ·
        <a href="https://github.com/dehero/mwscr">Source code</a>
      </p>
      <p id="status"></p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      if (params.has('code')) {
        document.getElementById('status').textContent = 'Authorization code received. You can close this page.';
      }
    </script>
  </body>
</html>
